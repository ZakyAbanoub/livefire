table:
  name: memberships
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: anonymous
    permission:
      columns:
        - org_id
        - role
        - user_id
      filter: {}
  - role: user
    permission:
      columns:
        - org_id
        - role
        - user_id
      filter:
        org:
          memberships:
            user_id:
              _eq: X-Hasura-User-Id
